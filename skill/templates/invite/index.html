<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Accept invite · Cockpit</title>
  <link rel="stylesheet" href="/auth/login/cockpit-login.css">
  <script src="/auth/invite/cockpit-invite.js" defer></script>
</head>
<body>
  <main class="login">
    <h1>Join this Cockpit</h1>
    <section aria-labelledby="enroll-heading" id="enroll-section">
      <h2 id="enroll-heading">Create your passkey</h2>
      <p>You were invited to sign in to this Cockpit. Create a passkey on this device, a phone, or a security key. The invite link works once.</p>
      <form id="enroll-form">
        <label for="label">Device label <span class="hint">(optional)</span></label>
        <input id="label" name="label" maxlength="64">
        <button type="submit" id="enroll">Create a passkey</button>
      </form>
    </section>

    <p id="sign-in-link" hidden><a href="/auth/login/">Sign in with a passkey</a></p>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript><p>Creating a passkey needs JavaScript.</p></noscript>
  </main>
</body>
</html>
