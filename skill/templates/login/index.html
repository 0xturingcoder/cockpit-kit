<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign in · Cockpit</title>
  <link rel="stylesheet" href="/auth/login/cockpit-login.css">
  <script src="/auth/login/cockpit-login.js" defer></script>
</head>
<body>
  <main class="login">
    <h1>Sign in to Cockpit</h1>
    <section aria-labelledby="sign-in-heading">
      <h2 id="sign-in-heading">Passkey</h2>
      <p>Use a passkey saved on this device, a phone, or a security key.</p>
      <button type="button" id="sign-in">Sign in with a passkey</button>
    </section>

    <section aria-labelledby="register-heading">
      <h2 id="register-heading">Add a passkey</h2>
      <p>For the owner. Open the tokenized URL the server printed first, then add a passkey for this device.</p>
      <form id="register-form">
        <label for="display-name">Your name <span class="hint">(only when creating the owner)</span></label>
        <input id="display-name" name="display_name" autocomplete="name" maxlength="128">
        <label for="label">Device label <span class="hint">(optional)</span></label>
        <input id="label" name="label" maxlength="64">
        <button type="submit" id="register">Add a passkey</button>
      </form>
    </section>

    <p class="hint"><a href="/auth/settings/">Devices and sign out</a></p>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript><p>Passkey sign-in needs JavaScript.</p></noscript>
  </main>
</body>
</html>
