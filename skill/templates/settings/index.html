<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Devices · Cockpit</title>
  <link rel="stylesheet" href="/auth/login/cockpit-login.css">
  <script src="/auth/settings/cockpit-settings.js" defer></script>
</head>
<body>
  <main class="login settings">
    <h1>Devices</h1>
    <p id="signed-in-as" class="hint"></p>

    <section aria-labelledby="sessions-heading" id="sessions-section" hidden>
      <h2 id="sessions-heading">Signed-in devices</h2>
      <p>Each passkey sign-in is a separate session. Revoking one signs that device out on its next request.</p>
      <ul id="sessions" class="items"></ul>
      <button type="button" id="sign-out">Sign out on this device</button>
    </section>

    <section aria-labelledby="users-heading" id="users-section" hidden>
      <h2 id="users-heading">All users</h2>
      <p>As the owner you can revoke any user's sessions and remove their passkeys. Your last passkey cannot be removed.</p>
      <div id="users"></div>
    </section>

    <p id="sign-in-link" hidden><a href="/auth/login/">Sign in with a passkey</a></p>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript><p>This page needs JavaScript.</p></noscript>
  </main>
</body>
</html>
